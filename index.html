<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>articulate-cert-lab — continuous-time self-collision certificate</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; background: #0b0e13; color: #d7dee8; }
  #app { display: grid; grid-template-columns: 320px 1fr; height: 100vh; }
  aside { padding: 14px; overflow-y: auto; border-right: 1px solid #1e2733; }
  canvas { display: block; width: 100%; height: 100%; }
  h1 { font-size: 14px; margin: 0 0 10px; letter-spacing: .04em; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: #6f8098; margin: 16px 0 6px; }
  label { display: block; margin: 8px 0 2px; color: #9fb0c6; }
  input[type=range] { width: 100%; }
  select, button { width: 100%; background: #131a24; color: #d7dee8; border: 1px solid #26313f; padding: 6px; border-radius: 4px; font: inherit; }
  button { cursor: pointer; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  td, th { text-align: left; padding: 2px 4px; border-bottom: 1px solid #1a222c; }
  .ok { color: #56d364; } .bad { color: #ff7b72; } .warn { color: #e3b341; }
  #verdict { margin-top: 10px; padding: 8px; border-radius: 4px; background: #131a24; border: 1px solid #26313f; }
  .legend { color: #6f8098; }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.169.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="app">
  <aside>
    <h1>articulate-cert-lab</h1>
    <div class="legend">Continuous-time self-collision certificate for articulated chains. This page computes nothing itself: every number comes from <code>src/core.mjs</code>, the same module <code>bench/verify.mjs</code> runs in node.</div>

    <h2>Chain</h2>
    <select id="chain"></select>

    <h2>Timeline</h2>
    <label>t = <span id="tval">0.000</span></label>
    <input type="range" id="t" min="0" max="1" step="0.0005" value="0">

    <h2>Motion damping s</h2>
    <label>θ(t) = θ₀ + s·(θ(t) − θ₀) &nbsp; s = <span id="sval">1.000</span></label>
    <input type="range" id="s" min="0" max="1" step="0.001" value="1">

    <button id="recert">Re-certify this chain (live, same core)</button>

    <h2>Verdict</h2>
    <div id="verdict">…</div>

    <h2>Collision intervals</h2>
    <table id="ivals"><tbody></tbody></table>
  </aside>
  <canvas id="view"></canvas>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
